<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1TMZNJFR4L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1TMZNJFR4L');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 七堵春節店家資訊</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f9f8f6;
            --text-main: #2c2c2c;
            --text-sub: #6b6b6b;
            --accent-red: #e85d7a;
            --accent-line: #06C755;
            --accent-fb: #1877F2;
            --accent-shop: #FF9900; /* 線上購物：活力橙 */
            --accent-web: #6366F1;  /* 官網：專業靛 */
            --border-color: #e5e2dd;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --search-glow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 0 0 40px; }

        /* 搜尋列 */
        .search-bar { display: none; }
        .search-bar.active { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 65px; background: white; z-index: 2100; align-items: center; padding: 0 20px; box-shadow: var(--search-glow); }
        .search-bar input { flex: 1; border: none; outline: none; font-size: 1.1rem; margin: 0 15px; background: transparent; }
        .search-bar svg { width: 20px; height: 20px; color: #999; stroke-width: 1.5; }
        .search-clear-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ccc; }

        header { padding: 40px 15px 20px; text-align: center; }
        h1 { font-size: 1.6rem; font-weight: 500; letter-spacing: 2px; }

        /* 置頂導覽 */
        .sticky-nav { position: sticky; top: 0; background: var(--bg-color); z-index: 1000; padding: 10px 0 0; }
        .nav-top-row { display: flex; align-items: center; max-width: 1440px; margin: 0 auto; padding: 0 15px; gap: 12px; }
        .filter-buttons { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex-grow: 1; padding: 5px 0; }
        .filter-buttons::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: white; white-space: nowrap; cursor: pointer; font-size: 0.85rem;}
        .filter-btn.active { background: var(--text-main); color: white; border-color: var(--text-main); }
        .search-icon-btn { flex-shrink: 0; width: 40px; height: 40px; background: white; border: 1px solid var(--border-color); border-radius: 50%; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
        
        .date-tabs { display: flex; gap: 20px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; border-bottom: 1px solid var(--border-color); max-width: 1440px; margin: 0 auto; }
        .date-tab { white-space: nowrap; font-size: 0.85rem; color: var(--text-sub); cursor: pointer; }
        .date-tab.active { color: var(--accent-red); font-weight: bold; border-bottom: 2px solid var(--accent-red); }

        /* 內容容器 */
        .main-content { padding: 20px 15px; min-height: 400px; }
        .stores-grid { display: flex; gap: 20px; max-width: 1440px; margin: 0 auto; align-items: flex-start; }
        .grid-column { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        @media (max-width: 600px) { .stores-grid { gap: 15px; } .grid-column { gap: 15px; } }

        /* 無資料顯示樣式 */
        .no-data {
            grid-column: 1 / -1;
            width: 100%;
            text-align: center;
            padding: 80px 20px;
            color: #ccc;
        }
        .no-data svg { width: 48px; height: 48px; margin-bottom: 15px; opacity: 0.5; }
        .no-data p { font-size: 0.95rem; color: #999; }

        /* 卡片與內容 */
        .store-card { background: white; border-radius: 12px; padding: 18px; border: 1px solid var(--border-color); box-shadow: var(--shadow); width: 100%; }
        .store-card.is-closed { opacity: 0.55; }
        .store-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .store-name { font-size: 1.1rem; font-weight: 500; color: var(--text-main); flex: 1; line-height: 1.3; }
        .category-text { font-size: 0.75rem; color: #bbb; margin-left: 8px; flex-shrink: 0; }
        .contact-info { margin-bottom: 6px; }
        .contact-item { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-sub); text-decoration: none; line-height: 2; }
        .contact-item svg { width: 16px; height: 16px; stroke-width: 1.5; flex-shrink: 0; color: #bbb; }
        .status-text { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 400; margin-bottom: 15px; padding-left: 2px; color: var(--accent-red); }
        .status-text svg { width: 14px; height: 14px; stroke-width: 1.5; }
        .remark-box { border-left: 3px solid #eee; padding: 2px 0 2px 12px; margin-bottom: 15px; font-size: 0.82rem; color: var(--text-sub); line-height: 1.6; }

        /* 社群按鈕與色彩 */
        .social-links { display: flex; gap: 12px; margin-top: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .social-btn { 
            background: #f4f2ef; color: var(--text-sub); 
            width: 36px; height: 36px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; text-decoration: none;
        }
        .social-btn svg { width: 18px; height: 18px; stroke-width: 1.5; fill: none; stroke: currentColor; }
        .social-btn.line svg { fill: currentColor; stroke: none; width: 20px; height: 20px; } 

        .social-btn:hover { background: #eee; color: var(--accent-red); transform: translateY(-2px); }
        .social-btn.line:hover { color: var(--accent-line); }
        .social-btn.fb:hover { color: var(--accent-fb); }
        .social-btn.shop:hover { color: var(--accent-shop); } /* 線上購物 Hover */
        .social-btn.web:hover { color: var(--accent-web); }   /* 官網 Hover */

        .store-details { display: none; margin-bottom: 15px; }
        .store-schedule { border: 1px solid #f0f0f0; border-radius: 8px; overflow: hidden; margin: 10px 0; }
        .schedule-item { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 8px 12px; color: #555; }
        .schedule-item:nth-child(odd) { background: #ffffff; }
        .schedule-item:nth-child(even) { background: #f7f7f7; }

        .toggle-btn { width: 100%; padding: 10px; background: #fcfcfc; border: 1px solid #eee; border-radius: 8px; color: #999; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }

        .footer { width: 100%; text-align: center; margin-top: 60px; padding: 40px 15px; color: var(--text-sub); font-size: 0.85rem; border-top: 1px solid var(--border-color); line-height: 1.8; clear: both; }
        .footer a { color: var(--text-main); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="search-bar" id="searchBar">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="搜尋店家名稱...">
        <div class="search-clear-btn" id="searchCloseBtn"><i data-lucide="x"></i></div>
    </div>

    <header><h1>2026 七堵春節店家</h1></header>

    <div class="sticky-nav">
        <div class="nav-top-row">
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="ALL">全</button>
                <button class="filter-btn" data-category="吃">吃</button>
                <button class="filter-btn" data-category="喝">喝</button>
                <button class="filter-btn" data-category="玩">玩</button>
                <button class="filter-btn" data-category="醫">醫</button>
                <button class="filter-btn" data-category="其">其</button>
            </div>
            <button class="search-icon-btn" id="searchBtn"><i data-lucide="search"></i></button>
        </div>
        <div class="date-tabs" id="dateTabs"></div>
    </div>

    <div class="main-content">
        <div id="loading" style="text-align:center; padding: 100px; color: #999;">載入中...</div>
        <div class="stores-grid" id="storesGrid"></div>
    </div>

    <div class="footer">
        <p>本頁面由 <a href="https://www.facebook.com/ilovecidu" target="_blank">我是七堵人</a> 製作維護</p>
        <p style="opacity: 0.7;">如須新增修改店家資訊，請私訊粉專聯繫</p>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSALQr5PXgc-3gU02FJf5Prvc0KNg7pEkVRtFbmWVMr972zor9hmyUWFCm0Z4ziFhtHMV-u1gih99Cq/pub?gid=0&single=true&output=csv';
        let storesData = []; let currentCategory = 'ALL'; let currentDate = 'ALL';

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function init() {
            try {
                const res = await fetch(CSV_URL); const csv = await res.text();
                const rows = csv.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim()));
                const headers = rows[0];
                storesData = rows.slice(1).map(r => {
                    let obj = {}; headers.forEach((h, i) => obj[headers[i]] = r[i] || ''); return obj;
                }).filter(s => s['店名']);

                storesData = shuffleArray(storesData);
                const today = new Date();
                const todayStr = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
                const activityDates = ['02/14', '02/15', '02/16', '02/17', '02/18', '02/19', '02/20', '02/21', '02/22'];
                currentDate = activityDates.includes(todayStr) ? todayStr : '02/16'; 

                initDateTabs(); setupFilters(); setupSearch(); render();
                document.getElementById('loading').style.display = 'none';
            } catch (e) { console.error(e); }
        }

        function setupFilters() {
            document.getElementById('filterButtons').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category;
                    render();
                }
            });
        }

        function initDateTabs() {
            const dates = [{ id: 'ALL', label: '全' }, { id: '02/14', label: '02/14' }, { id: '02/15', label: '02/15 小年夜' }, { id: '02/16', label: '02/16 除夕' }, { id: '02/17', label: '02/17 初一' }, { id: '02/18', label: '02/18 初二' }, { id: '02/19', label: '02/19 初三' }, { id: '02/20', label: '02/20 初四' }, { id: '02/21', label: '02/21 初五' }, { id: '02/22', label: '02/22' }];
            const container = document.getElementById('dateTabs');
            dates.forEach(d => {
                const el = document.createElement('div'); el.className = 'date-tab' + (d.id === currentDate ? ' active' : ''); el.textContent = d.label;
                el.onclick = () => { currentDate = d.id; document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); render(); };
                container.appendChild(el);
            });
        }

        function render() {
            const grid = document.getElementById('storesGrid'); grid.innerHTML = '';
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const displayDate = currentDate === 'ALL' ? '02/16' : currentDate;

            const filtered = storesData.filter(s => (currentCategory === 'ALL' || s['分類'] === currentCategory) && s['店名'].toLowerCase().includes(keyword));
            
            // 修正：處理無資料搜尋狀態
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-data"><i data-lucide="search-x"></i><p>找不到相符的店家，換個關鍵字試試看？</p></div>`;
                lucide.createIcons();
                return;
            }

            const openStores = []; const closedStores = [];
            filtered.forEach(s => { const status = s[displayDate] || '未提供'; if (status === '休' || status === '休息') closedStores.push(s); else openStores.push(s); });
            const finalDisplay = shuffleArray(openStores).concat(shuffleArray(closedStores));

            const width = window.innerWidth;
            let colCount = 4;
            if (width <= 600) colCount = 2; else if (width <= 1200) colCount = 3;

            const columns = [];
            for (let i = 0; i < colCount; i++) {
                const col = document.createElement('div'); col.className = 'grid-column'; columns.push(col); grid.appendChild(col);
            }
            finalDisplay.forEach((s, index) => {
                columns[index % colCount].appendChild(createCard(s, displayDate));
            });
            lucide.createIcons();
        }

        function createCard(s, displayDate) {
            const card = document.createElement('div'); const status = s[displayDate] || '未提供'; const isClosed = status === '休' || status === '休息';
            card.className = `store-card ${isClosed ? 'is-closed' : ''}`;
            
            const dates = ['02/14','02/15','02/16','02/17','02/18','02/19','02/20','02/21','02/22'];
            const labels = {'02/15':'小年夜','02/16':'除夕','02/17':'初一','02/18':'初二','02/19':'初三','02/20':'初四','02/21':'初五'};
            let scheduleHTML = '<div class="store-schedule">';
            dates.forEach(d => { const dStatus = s[d] || '未提供'; scheduleHTML += `<div class="schedule-item ${dStatus.includes('休') ? 'closed' : ''}"><span>${d}${labels[d] ? ' '+labels[d] : ''}</span><span>${dStatus}</span></div>`; });
            scheduleHTML += '</div>';

            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('基隆市七堵區' + s['地址'])}`;
            const lineIcon = `<svg viewBox="0 0 24 24"><path d="M24 10.304c0-4.58-4.644-8.304-10.36-8.304C7.92 2 3.276 5.724 3.276 10.304c0 4.108 3.7 7.525 8.703 8.163.339.073.799.223.916.51.105.257.069.658.034.918l-.151 1.054c-.046.332-.224 1.298 1.042.708 1.266-.59 6.836-4.026 9.327-6.892 1.638-1.782 1.861-3.328 1.861-4.46zM8.406 13.931H6.463a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h1.943a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47H7.461v3.473h.945a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47zm2.592 0h-1.041a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h1.041a.47.47 0 0 1 .47.47v5.851a.47.47 0 0 1-.47.47zm5.228 0h-1.155l-2.001-3.414v2.944a.47.47 0 0 1-.47.47h-1.04a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h1.154l2.002 3.414V7.61a.47.47 0 0 1 .47-.47h1.041a.47.47 0 0 1 .47.47v5.851a.47.47 0 0 1-.47.47zm4.242-2.147a.47.47 0 0 1-.47.47h-1.943v1.204h1.943a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47h-3.453a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h3.453a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47h-1.943v1.171h1.943a.47.47 0 0 1 .47.47v.433z"/></svg>`;

            card.innerHTML = `
                <div class="store-header">
                    <div class="store-name">${s['店名']}</div>
                    <div class="category-text">${s['分類'] || ''}</div>
                </div>
                <div class="contact-info">
                    ${s['地址'] ? `<a href="${mapUrl}" target="_blank" class="contact-item"><i data-lucide="map-pin"></i>${s['地址']}</a>` : ''}
                    ${s['電話'] ? `<a href="tel:${s['電話']}" class="contact-item"><i data-lucide="phone"></i>${s['電話']}</a>` : ''}
                </div>
                
                ${!isClosed ? `<div class="status-text"><i data-lucide="clock"></i>${displayDate} ${status}</div>` : ''}
                ${s['備註'] ? `<div class="remark-box">${s['備註']}</div>` : ''}

                <div class="store-details">${scheduleHTML}</div>

                <div class="social-links">
                    ${s['線上訂餐'] ? `<a href="${s['線上訂餐']}" target="_blank" class="social-btn shop" title="線上訂餐"><i data-lucide="shopping-bag"></i></a>` : ''}
                    ${(s['粉專'] || s['Facebook']) ? `<a href="${s['粉專'] || s['Facebook']}" target="_blank" class="social-btn fb" title="Facebook"><i data-lucide="facebook"></i></a>` : ''}
                    ${s['IG'] || s['Instagram'] ? `<a href="${s['IG'] || s['Instagram']}" target="_blank" class="social-btn" title="Instagram"><i data-lucide="instagram"></i></a>` : ''}
                    ${s['LINE'] ? `<a href="${s['LINE']}" target="_blank" class="social-btn line">${lineIcon}</a>` : ''}
                    ${s['官網'] ? `<a href="${s['官網']}" target="_blank" class="social-btn web" title="官網"><i data-lucide="globe"></i></a>` : ''}
                    ${s['Threads'] ? `<a href="${s['Threads']}" target="_blank" class="social-btn" title="Threads"><i data-lucide="at-sign"></i></a>` : ''}
                </div>

                <button class="toggle-btn">
                    <span>${isClosed ? '查看營業時段' : '更多時段'}</span>
                    <i data-lucide="chevron-down"></i>
                </button>`;

            const btn = card.querySelector('.toggle-btn'); const details = card.querySelector('.store-details');
            btn.onclick = () => {
                const isHidden = details.style.display === 'none' || !details.style.display;
                details.style.display = isHidden ? 'block' : 'none';
                btn.innerHTML = isHidden ? `<span>收合時段</span><i data-lucide="chevron-up"></i>` : `<span>${isClosed ? '查看營業時段' : '更多時段'}</span><i data-lucide="chevron-down"></i>`;
                lucide.createIcons();
            };
            return card;
        }

        function setupSearch() {
            const btn = document.getElementById('searchBtn'); const bar = document.getElementById('searchBar'); const input = document.getElementById('searchInput'); const closeBtn = document.getElementById('searchCloseBtn');
            btn.onclick = () => { bar.classList.add('active'); input.focus(); };
            closeBtn.onclick = () => { input.value = ''; render(); bar.classList.remove('active'); };
            input.oninput = render;
            lucide.createIcons();
        }

        window.onresize = render;
        init();
    </script>
</body>
</html>
