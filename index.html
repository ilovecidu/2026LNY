    <script>
        const PUBLISHED_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSALQr5PXgc-3gU02FJf5Prvc0KNg7pEkVRtFbmWVMr972zor9hmyUWFCm0Z4ziFhtHMV-u1gih99Cq/pub?gid=0&single=true&output=csv';

        let storesData = [];
        let currentCategory = 'ALL';
        let currentDate = 'ALL';

        async function loadData() {
            try {
                const response = await fetch(PUBLISHED_CSV_URL);
                if (!response.ok) throw new Error('無法讀取資料');
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                if (!rows || rows.length === 0) throw new Error('試算表沒有資料');

                const headers = rows[0];
                storesData = rows.slice(1).map(row => {
                    const store = {};
                    headers.forEach((header, index) => {
                        store[header] = row[index] || '';
                    });
                    return store;
                }).filter(store => store['店名']);

                // 隨機排序店家資料
                storesData = shuffleArray(storesData);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('filterButtons').style.display = 'flex';
                
                initializeDateTabs();
                renderStores();
                setupDateTabsScroll();
                setupSearch();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        }

        // Fisher-Yates 洗牌演算法
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let line of lines) {
                if (!line.trim()) continue;
                const row = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const nextChar = line[i + 1];
                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                result.push(row);
            }
            return result;
        }

        function initializeDateTabs() {
            const dates = [
                { id: 'ALL', label: '全部' },
                { id: '02/14', label: '02/14 (六)' },
                { id: '02/15', label: '02/15 (日) 小年夜' },
                { id: '02/16', label: '02/16 (一) 除夕' },
                { id: '02/17', label: '02/17 (二) 初一' },
                { id: '02/18', label: '02/18 (三) 初二' },
                { id: '02/19', label: '02/19 (四) 初三' },
                { id: '02/20', label: '02/20 (五) 初四' },
                { id: '02/21', label: '02/21 (六) 初五' },
                { id: '02/22', label: '02/22 (日)' }
            ];
            const dateTabs = document.getElementById('dateTabs');
            
            // 自動偵測當前日期並選中
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayStr = `${month}/${day}`;
            
            // 判斷今天是否在活動期間 (02/14 - 02/22)
            const activityDates = ['02/14', '02/15', '02/16', '02/17', '02/18', '02/19', '02/20', '02/21', '02/22'];
            const shouldAutoSelect = activityDates.includes(todayStr);
            const autoSelectDate = shouldAutoSelect ? todayStr : 'ALL';
            
            dates.forEach(date => {
                const tab = document.createElement('div');
                tab.className = 'date-tab' + (date.id === autoSelectDate ? ' active' : '');
                tab.textContent = date.label;
                tab.dataset.date = date.id;
                tab.addEventListener('click', () => selectDate(date.id));
                dateTabs.appendChild(tab);
            });
            
            // 設置當前日期並渲染
            currentDate = autoSelectDate;
            
            // 等待 DOM 更新後，自動捲動到選中的日期頁籤
            setTimeout(() => {
                const activeTab = dateTabs.querySelector('.date-tab.active');
                if (activeTab && autoSelectDate !== 'ALL') {
                    activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 0);
        }

        function setupDateTabsScroll() {
            const dateTabs = document.getElementById('dateTabs');

            dateTabs.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    e.preventDefault();
                    dateTabs.scrollLeft += e.deltaY;
                }
            }, { passive: false });

            let startY = 0;
            dateTabs.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            }, { passive: true });

            dateTabs.addEventListener('touchmove', (e) => {
                const currentY = e.touches[0].clientY;
                const diff = Math.abs(currentY - startY);
                if (diff > 5) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        function selectDate(date) {
            currentDate = date;
            document.querySelectorAll('.date-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.date === date);
            });
            // 捲動到選中的日期
            const selectedTab = document.querySelector(`[data-date="${date}"]`);
            if (selectedTab) {
                selectedTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            renderStores();
        }

        function renderStores() {
            const grid = document.getElementById('storesGrid');
            grid.innerHTML = '';
            const filteredStores = storesData.filter(store => {
                if (currentCategory !== 'ALL' && store['分類'] !== currentCategory) return false;
                if (currentDate !== 'ALL' && (!store[currentDate] || store[currentDate] === '休' || store[currentDate].includes('休'))) return false;
                return true;
            });
            
            if (filteredStores.length === 0) {
                grid.innerHTML = '<div class="no-results">找不到相符的店家</div>';
            } else {
                filteredStores.forEach(store => {
                    grid.appendChild(createStoreCard(store));
                });
            }
        }

        function createStoreCard(store) {
            const card = document.createElement('div');
            card.className = 'store-card';

            const header = document.createElement('div');
            header.className = 'store-header';
            
            const name = document.createElement('div');
            name.className = 'store-name';
            name.textContent = store['店名'] || '未命名';
            
            const category = document.createElement('span');
            category.className = `store-category category-${store['分類'] || '其'}`;
            category.textContent = store['分類'] || '其他';
            
            header.appendChild(name);
            header.appendChild(category);
            card.appendChild(header);

            const info = document.createElement('div');
            info.className = 'store-info';

            if (store['電話']) {
                const phone = document.createElement('div');
                phone.className = 'info-item';
                phone.innerHTML = `<i class="la la-phone"></i><a href="tel:${store['電話']}">${store['電話']}</a>`;
                info.appendChild(phone);
            }

            if (store['地址']) {
                const address = document.createElement('div');
                address.className = 'info-item';
                // 自動在地址前方加上「基隆市七堵區」，確保對位正確
                const fullAddress = `基隆市七堵區${store['地址']}`;
                const encodedAddress = encodeURIComponent(fullAddress);
                address.innerHTML = `<i class="la la-map-marker"></i><a href="https://www.google.com/maps/search/?api=1&query=${encodedAddress}" target="_blank">${store['地址']}</a>`;
                info.appendChild(address);
            }

            // 新增備註欄位
            if (store['備註']) {
                const note = document.createElement('div');
                note.className = 'store-note';
                note.innerHTML = store['備註'];
                info.appendChild(note);
            }

            card.appendChild(info);

            // 營業時間表 (放在上方) - 始終顯示完整 9 天資訊
            const schedule = document.createElement('div');
            schedule.className = 'store-schedule';
            const dates = ['02/14', '02/15', '02/16', '02/17', '02/18', '02/19', '02/20', '02/21', '02/22'];
            const dateLabels = {'02/14':'','02/15':'小年夜','02/16':'除夕','02/17':'初一','02/18':'初二','02/19':'初三','02/20':'初四','02/21':'初五','02/22':''};
            const dayOfWeek = {'02/14':'六','02/15':'日','02/16':'一','02/17':'二','02/18':'三','02/19':'四','02/20':'五','02/21':'六','02/22':'日'};

            // 始終顯示全部 9 天的營業資訊
            dates.forEach(date => schedule.appendChild(createScheduleItem(date, store[date], dateLabels[date], dayOfWeek[date])));
            card.appendChild(schedule);

            // 社群連結 (放在下方)
            const socialLinks = document.createElement('div');
            socialLinks.className = 'social-links';

            const addSocial = (url, iconClass, title) => {
                if (url) {
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.className = 'social-btn';
                    a.title = title;
                    a.innerHTML = `<i class="${iconClass}"></i>`;
                    socialLinks.appendChild(a);
                }
            };

            addSocial(store['線上訂餐'], 'la la-shopping-cart', '線上訂餐');
            addSocial(store['粉專'] || store['Facebook'], 'la la-facebook', 'Facebook');
            addSocial(store['LINE'], 'lab la-line', 'LINE');
            addSocial(store['IG'] || store['Instagram'], 'la la-instagram', 'Instagram');
            addSocial(store['官網'], 'la la-globe', '官網');
            addSocial(store['Threads'], 'las la-at', 'Threads');

            if (socialLinks.children.length > 0) card.appendChild(socialLinks);

            return card;
        }

        function createScheduleItem(date, status, label, day) {
            const item = document.createElement('div');
            item.className = 'schedule-item';
            // 嚴格判斷：只有完全等於「休息」或「休」才套用休息樣式
            const isClosed = status === '休息' || status === '休';
            item.classList.add(isClosed ? 'closed' : 'open');
            
            const dateSpan = document.createElement('span');
            dateSpan.className = 'date-label';
            // 顯示完整日期格式 (日期 (星期) 標籤)
            const dayDisplay = day ? ` (${day})` : '';
            const labelDisplay = label ? ` ${label}` : '';
            dateSpan.textContent = `${date}${dayDisplay}${labelDisplay}`;
            
            const statusSpan = document.createElement('span');
            statusSpan.className = 'status-text';
            // 完整顯示營業狀態，僅在休息時顯示「休息」，其餘原樣呈現
            statusSpan.textContent = isClosed ? '休息' : (status || '營業');
            
            item.appendChild(dateSpan);
            item.appendChild(statusSpan);
            return item;
        }

        function setupSearch() {
            const searchBtn = document.getElementById('searchBtn');
            const searchBar = document.getElementById('searchBar');
            const searchInput = document.getElementById('searchInput');
            const searchClose = document.getElementById('searchClose');
            const grid = document.getElementById('storesGrid');

            searchBtn.addEventListener('click', () => {
                searchBar.classList.add('active');
                searchInput.focus();
            });

            searchClose.addEventListener('click', () => {
                searchBar.classList.remove('active');
                searchInput.value = '';
                renderStores();
            });

            searchInput.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase().trim();
                if (keyword === '') {
                    renderStores();
                    return;
                }

                const filteredStores = storesData.filter(store => {
                    if (currentCategory !== 'ALL' && store['分類'] !== currentCategory) return false;
                    if (currentDate !== 'ALL' && (!store[currentDate] || store[currentDate] === '休' || store[currentDate].includes('休'))) return false;
                    return store['店名'].toLowerCase().includes(keyword);
                });

                grid.innerHTML = '';
                if (filteredStores.length === 0) {
                    grid.innerHTML = '<div class="no-results">找不到相符的店家</div>';
                } else {
                    filteredStores.forEach(store => {
                        grid.appendChild(createStoreCard(store));
                    });
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && searchBar.classList.contains('active')) {
                    searchBar.classList.remove('active');
                    searchInput.value = '';
                    renderStores();
                }
            });

            document.addEventListener('click', (e) => {
                if (!searchBar.contains(e.target) && !searchBtn.contains(e.target)) {
                    searchBar.classList.remove('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('filterButtons').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category;
                    const searchInput = document.getElementById('searchInput');
                    searchInput.value = '';
                    renderStores();
                }
            });
            // 回到頂部按鈕邏輯
            const goToTopBtn = document.getElementById('goToTopBtn');
            if (goToTopBtn) {
                window.addEventListener('scroll', () => {
                    if (window.pageYOffset > 300) {
                        goToTopBtn.classList.add('show');
                    } else {
                        goToTopBtn.classList.remove('show');
                    }
                }, { passive: true });
                goToTopBtn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            loadData();
        });
    </script>
</body>
</html>
