<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1TMZNJFR4L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1TMZNJFR4L');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 七堵春節店家資訊</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fffbf2 0%, #fff0f5 50%, #f4f8ff 100%);
            --text-main: #4a4a4a;
            --text-sub: #8e8e8e;
            --accent-main: #E75480; 
            --accent-purple: #9b84d1; /* 修正：更搭 Banner 的類別配色 */
            --accent-purple-border: rgba(182, 146, 208, 0.3);
            --soft-gradient: linear-gradient(90deg, #ffcad4, #fde2e4, #fad2e1, #bee1e6);
            --border-color: #f0ebf5;
            --shadow: 0 8px 25px rgba(182, 146, 208, 0.1);
            --accent-line: #06C755;
            --accent-fb: #1877F2;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); line-height: 1.5; overflow-x: hidden; }
        .page-wrapper { width: 100%; position: relative; }
        .festive-top-bar { height: 4px; background: var(--soft-gradient); width: 100%; }

        /* 搜尋列 */
        .search-bar { display: none; }
        .search-bar.active { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 65px; background: rgba(255, 255, 255, 0.98); z-index: 2100; align-items: center; padding: 0 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-bottom: 2px solid var(--accent-main); backdrop-filter: blur(10px); }
        .search-bar input { flex: 1; border: none; outline: none; font-size: 1.1rem; margin: 0 15px; background: transparent; }

        header { padding: 50px 15px 30px; text-align: center; }
        .year-tag { font-size: 0.7rem; color: var(--accent-main); letter-spacing: 3px; margin-bottom: 8px; font-weight: 500; opacity: 0.8; }
        h1 { font-family: 'Noto Serif TC', serif; font-size: 1.8rem; letter-spacing: 4px; background: linear-gradient(to right, var(--accent-main), #b692d0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }

        /* 置頂導覽 */
        .sticky-nav { position: sticky; top: 0; background: transparent; transition: all 0.3s ease-in-out; z-index: 1000; padding: 12px 0 0; }
        .sticky-nav.is-stuck { background: rgba(255, 252, 248, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(231, 84, 128, 0.1); }
        .nav-container { max-width: 1400px; margin: 0 auto; }
        .nav-top-row { display: flex; align-items: center; padding: 0 15px 8px; gap: 10px; }
        .filter-buttons { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        .filter-buttons::-webkit-scrollbar { display: none; }
        
        .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--accent-purple-border); background: transparent; color: var(--text-main) !important; white-space: nowrap; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .filter-btn.active { background: var(--accent-main); color: white !important; border-color: var(--accent-main); }

        /* 搜尋按鈕微縮 */
        .search-icon-btn { flex-shrink: 0; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.5); border: 1px solid var(--accent-main); border-radius: 50%; color: var(--accent-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-icon-btn svg { width: 14px !important; height: 14px !important; stroke-width: 1.8; }

        .date-tabs { display: flex; gap: 20px; overflow-x: auto; padding: 10px 15px 8px; border-top: 1px solid rgba(182, 146, 208, 0.1); scrollbar-width: none; justify-content: flex-start; -webkit-overflow-scrolling: touch; }
        .date-tabs::-webkit-scrollbar { display: none; }
        .date-tab { white-space: nowrap; font-size: 0.82rem; color: var(--text-sub) !important; cursor: pointer; padding-bottom: 8px; }
        .date-tab.active { color: var(--accent-main) !important; font-weight: bold; border-bottom: 2.5px solid var(--accent-main); }

        .main-content { padding: 25px 15px; max-width: 1400px; margin: 0 auto; min-height: 60vh; }
        .stores-grid { display: flex; gap: 15px; width: 100%; align-items: flex-start; }
        .grid-column { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 0; }
        @media (max-width: 600px) { .stores-grid { gap: 12px; } .grid-column { gap: 12px; } .date-tabs { padding-left: 15px; } }

        /* 店家卡片 */
        .store-card { background: rgba(255, 255, 255, 0.9); border-radius: 12px; padding: 22px 18px 18px; border: 1px solid white; border-top: 4px solid; border-image: var(--soft-gradient) 1; box-shadow: var(--shadow); width: 100%; position: relative; backdrop-filter: blur(5px); }
        .store-card.is-closed { opacity: 0.6; filter: grayscale(15%); }
        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; }
        .store-name { font-family: 'Noto Serif TC', serif; font-size: 1.15rem; color: #333; flex: 1; line-height: 1.3; font-weight: 700; }
        
        /* 修正：類別配色調整為薰衣草紫 */
        .category-text { font-size: 0.72rem; color: var(--accent-purple); flex-shrink: 0; font-weight: 500; }
        
        .contact-info { margin-bottom: 6px; }
        .contact-item { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-sub) !important; text-decoration: none; line-height: 2.2; }
        .store-card svg { width: 14px !important; height: 14px !important; stroke-width: 1.5 !important; flex-shrink: 0; }
        .status-text { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; margin-bottom: 12px; color: var(--accent-main); }
        .remark-box { border-left: 3px solid var(--accent-main); padding: 4px 0 4px 12px; margin-bottom: 15px; font-size: 0.82rem; color: #8d5b6b; line-height: 1.6; background: linear-gradient(to right, rgba(231, 84, 128, 0.05), transparent); }

        .store-details { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.4s ease-in-out, opacity 0.3s ease; }
        .store-details.open { max-height: 500px; opacity: 1; margin-bottom: 15px; margin-top: 8px; }
        .store-schedule { border: 1px solid #f6f3f8; border-radius: 8px; overflow: hidden; }
        .schedule-item { display: flex; justify-content: space-between; font-size: 0.72rem; padding: 9px 12px; color: #666; background: #ffffff; }
        .schedule-item:nth-child(even) { background: #faf9fb; }

        /* 社群按鈕：LINE Hover 修正 */
        .social-links { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .social-btn { background: rgba(255,255,255,0.5); color: var(--text-sub); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; border: 1px solid #f0ebf2; }
        .social-btn:hover { background: var(--accent-main); color: white !important; transform: translateY(-2px); }
        .social-btn.line:hover { background: var(--accent-line); color: white !important; }
        
        /* 修正：LINE 圖示在懸浮時強制變白 */
        .social-btn.line:hover svg { fill: white !important; }
        .social-btn.line svg { fill: currentColor; stroke: none; width: 22px !important; height: 22px !important; }

        .toggle-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.6); border: 1px solid var(--border-color); border-radius: 8px; color: var(--accent-main); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; }

        /* Footer 透明化 */
        .footer { background: transparent; text-align: center; padding: 60px 15px; width: 100%; border-top: 1px solid rgba(182, 146, 208, 0.1); }
        .footer p { font-size: 0.85rem !important; margin: 0; line-height: 2.2; color: #777; }
        .footer a { color: var(--accent-main); text-decoration: none; font-weight: 700; border-bottom: 1px dashed var(--accent-main); }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="festive-top-bar"></div>
        <div class="search-bar" id="searchBar"><i data-lucide="search"></i><input type="text" id="searchInput" placeholder="搜尋店家..."><div class="search-clear-btn" id="searchCloseBtn"><i data-lucide="x"></i></div></div>
        <header><div class="year-tag">丙午馬年 ‧ 二零二六</div><h1>2026 七堵春節店家資訊</h1></header>
        <div class="sticky-nav" id="stickyNav">
            <div class="nav-container">
                <div class="nav-top-row">
                    <div class="filter-buttons" id="filterButtons">
                        <button class="filter-btn active" data-category="ALL">全</button>
                        <button class="filter-btn" data-category="吃">吃</button>
                        <button class="filter-btn" data-category="喝">喝</button>
                        <button class="filter-btn" data-category="玩">玩</button>
                        <button class="filter-btn" data-category="醫">醫</button>
                        <button class="filter-btn" data-category="其">其</button>
                    </div>
                    <button class="search-icon-btn" id="searchBtn"><i data-lucide="search"></i></button>
                </div>
                <div class="date-tabs" id="dateTabs"></div>
            </div>
        </div>
        <div class="main-content"><div id="loading" style="text-align:center; padding: 100px; color: var(--accent-main);">美好時光載入中...</div><div class="stores-grid" id="storesGrid"></div></div>
        <div class="footer"><p>本頁面由 <a href="https://www.facebook.com/ilovecidu" target="_blank">我是七堵人</a> 製作維護</p><p>如須新增修改店家資訊，請私訊粉專聯繫</p></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSALQr5PXgc-3gU02FJf5Prvc0KNg7pEkVRtFbmWVMr972zor9hmyUWFCm0Z4ziFhtHMV-u1gih99Cq/pub?gid=0&single=true&output=csv';
        let storesData = []; let currentCategory = 'ALL'; let currentDate = 'ALL';

        const nav = document.getElementById('stickyNav');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 80) nav.classList.add('is-stuck');
            else nav.classList.remove('is-stuck');
        });

        function shuffleArray(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }
        async function init() {
            try {
                const res = await fetch(CSV_URL); const csv = await res.text();
                const rows = csv.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim()));
                const headers = rows[0];
                storesData = rows.slice(1).map(r => { let obj = {}; headers.forEach((h, i) => obj[headers[i]] = r[i] || ''); return obj; }).filter(s => s['店名']);
                storesData = shuffleArray(storesData);
                const today = new Date(); const todayStr = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
                currentDate = ['02/14','02/15','02/16','02/17','02/18','02/19','02/20','02/21','02/22'].includes(todayStr) ? todayStr : '02/16'; 
                initDateTabs(); setupFilters(); setupSearch(); render();
                document.getElementById('loading').style.display = 'none';
            } catch (e) { console.error(e); }
        }
        function setupFilters() {
            document.getElementById('filterButtons').addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active'); currentCategory = e.target.dataset.category; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }
        function initDateTabs() {
            const dates = [{ id: 'ALL', label: '全' }, { id: '02/14', label: '02/14' }, { id: '02/15', label: '02/15 小年' }, { id: '02/16', label: '02/16 除夕' }, { id: '02/17', label: '02/17 初一' }, { id: '02/18', label: '02/18 初二' }, { id: '02/19', label: '02/19 初三' }, { id: '02/20', label: '02/20 初四' }, { id: '02/21', label: '02/21 初五' }, { id: '02/22', label: '02/22' }];
            const container = document.getElementById('dateTabs');
            dates.forEach(d => {
                const el = document.createElement('div'); el.className = 'date-tab' + (d.id === currentDate ? ' active' : ''); el.textContent = d.label;
                el.onclick = () => { currentDate = d.id; document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                container.appendChild(el);
            });
        }
        function render() {
            const grid = document.getElementById('storesGrid'); grid.innerHTML = '';
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const displayDate = currentDate === 'ALL' ? '02/16' : currentDate;
            const filtered = storesData.filter(s => (currentCategory === 'ALL' || s['分類'] === currentCategory) && s['店名'].toLowerCase().includes(keyword));
            if (filtered.length === 0) { grid.innerHTML = `<div style="text-align:center; padding: 60px 20px; color:#ccc; width:100%;"><i data-lucide="search-x" style="width:48px;height:48px;margin-bottom:15px;opacity:0.5;"></i><p>找不到相符的店家</p></div>`; lucide.createIcons(); return; }
            const width = window.innerWidth; let colCount = width <= 600 ? 2 : (width <= 1200 ? 3 : 4);
            const columns = Array.from({length: colCount}, () => { const col = document.createElement('div'); col.className = 'grid-column'; grid.appendChild(col); return col; });
            const openStores = []; const closedStores = [];
            filtered.forEach(s => { const status = s[displayDate] || '未提供'; if (status === '休' || status === '休息') closedStores.push(s); else openStores.push(s); });
            const finalDisplay = shuffleArray(openStores).concat(shuffleArray(closedStores));
            finalDisplay.forEach((s, idx) => columns[idx % colCount].appendChild(createCard(s, displayDate)));
            lucide.createIcons();
        }
        function createCard(s, displayDate) {
            const card = document.createElement('div'); const status = s[displayDate] || '未提供'; const isClosed = status === '休' || status === '休息';
            card.className = `store-card ${isClosed ? 'is-closed' : ''}`;
            const dates = ['02/14','02/15','02/16','02/17','02/18','02/19','02/20','02/21','02/22'];
            const labels = {'02/15':'小年夜','02/16':'除夕','02/17':'初一','02/18':'初二','02/19':'初三','02/20':'初四','02/21':'初五'};
            let scheduleHTML = '<div class="store-schedule">';
            dates.forEach(d => { const dStatus = s[d] || '未提供'; scheduleHTML += `<div class="schedule-item"><span>${d}${labels[d] ? ' '+labels[d] : ''}</span><span>${dStatus}</span></div>`; });
            scheduleHTML += '</div>';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('基隆市七堵區' + s['地址'])}`;
            const lineIcon = `<svg viewBox="0 0 24 24"><path d="M24 10.304c0-4.58-4.644-8.304-10.36-8.304C7.92 2 3.276 5.724 3.276 10.304c0 4.108 3.7 7.525 8.703 8.163.339.073.799.223.916.51.105.257.069.658.034.918l-.151 1.054c-.046.332-.224 1.298 1.042.708 1.266-.59 6.836-4.026 9.327-6.892 1.638-1.782 1.861-3.328 1.861-4.46zM8.406 13.931H6.463a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h1.943a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47H7.461v3.473h.945a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47zm2.592 0h-1.041a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h1.041a.47.47 0 0 1 .47.47v5.851a.47.47 0 0 1-.47.47zm5.228 0h-1.155l-2.001-3.414v2.944a.47.47 0 0 1-.47.47h-1.04a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h1.154l2.002 3.414V7.61a.47.47 0 0 1 .47-.47h1.041a.47.47 0 0 1 .47.47v5.851a.47.47 0 0 1-.47.47zm4.242-2.147a.47.47 0 0 1-.47.47h-1.943v1.204h1.943a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47h-3.453a.47.47 0 0 1-.47-.47V7.61a.47.47 0 0 1 .47-.47h3.453a.47.47 0 0 1 .47.47v.433a.47.47 0 0 1-.47.47h-1.943v1.171h1.943a.47.47 0 0 1 .47.47v.433z"/></svg>`;
            card.innerHTML = `<div class="store-header"><div class="store-name">${s['店名']}</div><div class="category-text">${s['分類']}</div></div><div class="contact-info">${s['地址'] ? `<a href="${mapUrl}" target="_blank" class="contact-item"><i data-lucide="map-pin"></i>${s['地址']}</a>` : ''}${s['電話'] ? `<a href="tel:${s['電話']}" class="contact-item"><i data-lucide="phone"></i>${s['電話']}</a>` : ''}</div>${!isClosed ? `<div class="status-text"><i data-lucide="clock"></i>${displayDate} ${status}</div>` : ''}${s['備註'] ? `<div class="remark-box">${s['備註']}</div>` : ''}<div class="store-details">${scheduleHTML}</div><div class="social-links">${s['線上訂餐'] ? `<a href="${s['線上訂餐']}" target="_blank" class="social-btn shop"><i data-lucide="shopping-bag"></i></a>` : ''}${(s['粉專'] || s['Facebook']) ? `<a href="${s['粉專'] || s['Facebook']}" target="_blank" class="social-btn fb"><i data-lucide="facebook"></i></a>` : ''}${s['IG'] || s['Instagram'] ? `<a href="${s['IG'] || s['Instagram']}" target="_blank" class="social-btn"><i data-lucide="instagram"></i></a>` : ''}${s['LINE'] ? `<a href="${s['LINE']}" target="_blank" class="social-btn line">${lineIcon}</a>` : ''}${s['官網'] ? `<a href="${s['官網']}" target="_blank" class="social-btn web"><i data-lucide="globe"></i></a>` : ''}</div><button class="toggle-btn"><span>${isClosed ? '查看營業時段' : '更多時段'}</span><i data-lucide="chevron-down"></i></button>`;
            const btn = card.querySelector('.toggle-btn'); const details = card.querySelector('.store-details');
            btn.onclick = () => { const isOpen = details.classList.toggle('open'); btn.innerHTML = isOpen ? `<span>收合時段</span><i data-lucide="chevron-up"></i>` : `<span>${isClosed ? '查看營業時段' : '更多時段'}</span><i data-lucide="chevron-down"></i>`; lucide.createIcons(); };
            return card;
        }
        function setupSearch() { const btn = document.getElementById('searchBtn'); const bar = document.getElementById('searchBar'); const input = document.getElementById('searchInput'); const closeBtn = document.getElementById('searchCloseBtn'); btn.onclick = () => { bar.classList.add('active'); input.focus(); }; closeBtn.onclick = () => { input.value = ''; render(); bar.classList.remove('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); }; input.oninput = render; lucide.createIcons(); }
        window.onresize = render; init();
    </script>
</body>
</html>
